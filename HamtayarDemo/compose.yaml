name: hamtayar-staging
services:
  staging:
    image: neo4j:5.26.32-community
    ports:
      - "127.0.0.1:7476:7474"
      - "127.0.0.1:7689:7687"
    environment:
      NEO4J_AUTH: "neo4j/${STAGING_NEO4J_PASSWORD:?Set STAGING_NEO4J_PASSWORD in .env}"
    volumes:
      - staging_data:/data
    restart: unless-stopped
volumes:
  staging_data:
